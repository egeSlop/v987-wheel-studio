# American Truck Simulator (same plugin and controls as ETS2). Telemetry comes from the v987-dash SDK plugin, which Wheel Studio
# installs (Tablet page > Set up). Buttons name ETS2 controls (`action`): the key is read
# from your ATS profile's controls file, so rebinding in the game just works. `key` is the
# fallback (the SCS defaults).
id = "ats"
name = "American Truck Simulator"
match = ["ats", "american truck"]
theme = "truck"
accent = "#ef5350"
bindings = "ats"

[setup]
en = "Install the telemetry plugin from Wheel Studio (Tablet page). On the first start ATS asks about advanced SDK features: press OK."
tr = "Telemetri eklentisini Wheel Studio'dan kurun (Tablet sayfası). ATS ilk açılışta gelişmiş SDK özelliklerini soracak, Tamam deyin."

[radio]
mode = "game"
power = { action = "radio", key = "r" }
next = { action = "radionext", key = "pagedown" }
prev = { action = "radioprev", key = "pageup" }

[[readout]]
field = "speedLimit"
label = "Limit"
labels = { tr = "Hız sınırı" }
unit = "km/h"

[[readout]]
field = "cruise"
label = "Cruise"
labels = { tr = "Sabitleyici" }
unit = "km/h"

[[readout]]
field = "navDistance"
label = "To go"
labels = { tr = "Kalan yol" }
unit = "km"
decimals = 1

[[readout]]
field = "fuelRange"
label = "Range"
labels = { tr = "Menzil" }
unit = "km"

[[page]]
