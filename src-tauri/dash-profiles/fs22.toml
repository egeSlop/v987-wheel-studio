# Farming Simulator 22. Needs the FS22_WheelFFB mod (1.7+) for telemetry.
# Buttons name FS22 actions: the key is read from your own inputBinding.xml, so rebinding in
# the game just works. `key` is only the fallback (FS22's defaults).
id = "fs22"
name = "Farming Simulator 22"
match = ["fs22", "farming simulator 22"]
theme = "tractor"
accent = "#8bc34a"
bindings = "fs22"

[setup]
en = "Install the FS22_WheelFFB mod (1.7 or newer) and start the game with its launcher."
tr = "FS22_WheelFFB modunu (1.7 ya da üstü) kurun ve oyunu modun başlatıcısıyla açın."

[radio]
mode = "game"
stations = "fs22"
power = { action = "RADIO_TOGGLE", key = "5" }
next = { action = "RADIO_NEXT_CHANNEL", key = "6" }
prev = { action = "RADIO_PREVIOUS_CHANNEL", key = "4" }

[[readout]]
field = "fuel"
label = "Fuel"
labels = { tr = "Yakıt" }
unit = "%"
scale = 100

[[readout]]
field = "cruise"
label = "Cruise"
labels = { tr = "Hız sabitleyici" }
unit = "km/h"

[[readout]]
field = "rpm"
label = "Engine"
labels = { tr = "Devir" }
unit = "rpm"

[[page]]
name = "Drive"
names = { tr = "Sürüş" }

  [[page.button]]
  id = "engine"
  label = "Engine"
  labels = { tr = "Motor" }
  icon = "engine"
  action = "TOGGLE_MOTOR_STATE"
  key = "enter"
  active = "engine"
  tone = "ok"

  [[page.button]]
  id = "lights"
  label = "Lights"
  labels = { tr = "Farlar" }
  icon = "lights"
  action = "TOGGLE_LIGHTS"
  key = "f"
  active = "lightsLow"

  [[page.button]]
  id = "highbeam"
  label = "High beam"
  labels = { tr = "Uzun far" }
  icon = "highbeam"
  action = "TOGGLE_HIGH_BEAM_LIGHT"
  key = "lctrl+f"
  active = "lightsHigh"

  [[page.button]]
  id = "beacon"
  label = "Beacon"
  labels = { tr = "Tepe lambası" }
  icon = "beacon"
  action = "TOGGLE_BEACON_LIGHTS"
  key = "home"
  active = "beacon"
  tone = "warn"

  [[page.button]]
  id = "left"
  label = "Left"
  labels = { tr = "Sol sinyal" }
  icon = "left"
  action = "TOGGLE_TURNLIGHT_LEFT"
  key = "kp1"
  active = "blinkerLeft"
  tone = "ok"

  [[page.button]]
  id = "hazard"
  label = "Hazards"
  labels = { tr = "Dörtlü" }
  icon = "hazard"
  action = "TOGGLE_TURNLIGHT_HAZARD"
  key = "kp2"
  active = "hazard"
  tone = "danger"

  [[page.button]]
  id = "right"
  label = "Right"
  labels = { tr = "Sağ sinyal" }
  icon = "right"
  action = "TOGGLE_TURNLIGHT_RIGHT"
  key = "kp3"
  active = "blinkerRight"
  tone = "ok"

  [[page.button]]
  id = "horn"
  label = "Horn"
  labels = { tr = "Korna" }
  icon = "horn"
  action = "HONK"
  key = "0"
  hold = true

  [[page.button]]
  id = "cruise"
