  active = "cruiseOn"

  [[page.button]]
  id = "workfront"
  label = "Work lights front"
  labels = { tr = "Ön çalışma" }
  icon = "worklight"
  action = "TOGGLE_WORK_LIGHT_FRONT"
  key = "kp5"
  active = "lightsWorkFront"

  [[page.button]]
  id = "workback"
  label = "Work lights rear"
  labels = { tr = "Arka çalışma" }
  icon = "worklight"
  action = "TOGGLE_WORK_LIGHT_BACK"
  key = "kp6"
  active = "lightsWorkBack"

  [[page.button]]
  id = "camera"
  label = "Camera"
  labels = { tr = "Kamera" }
  icon = "camera"
  action = "CAMERA_SWITCH"
  key = "c"

  [[page.button]]
